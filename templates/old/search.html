{% extends "old/base.html" %}

{% block content %}

<style>
    .search-container {
        display: flex;
        gap: 8px;
        padding: 8px 8px 8px 0;
        max-height: calc(100vh - 120px);
        margin-bottom: 8px;
    }

    .search-main {
        flex: 1;
    }

    .title-bar-text {
        font-size: 18px !important;
    }

    /* Search input area */
    .search-input-area {
        padding: 12px;
        background: #c0c0c0;
        border-bottom: 2px solid;
        border-color: #dfdfdf #0a0a0a #0a0a0a #dfdfdf;
    }

    .search-input-wrapper {
        display: flex;
        gap: 8px;
        align-items: center;
    }

    .search-input {
        flex: 1;
        padding: 8px;
        border: none;
        background: #ffffff;
        box-shadow: inset -1px -1px #ffffff, inset 1px 1px grey, inset -2px -2px #dfdfdf, inset 2px 2px #0a0a0a;
        font-size: 13px;
        font-family: 'MS Sans Serif', Arial, sans-serif;
        color: #000000;
    }

    .search-input::placeholder {
        color: #808080;
    }

    .search-input:focus {
        outline: 1px dotted #000;
        outline-offset: -4px;
    }

    .search-btn {
        min-width: 80px;
        padding: 4px 16px;
        font-size: 13px;
    }

    /* Results area with dark green background */
    .search-results {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        margin-bottom: 0;
        background: #1a3a1a;
        border: 2px solid;
        border-color: #dfdfdf #0a0a0a #0a0a0a #dfdfdf;
        box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #ffffff;
        background: 
            repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15) 0px,
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            ),
            repeating-linear-gradient(
                90deg,
                rgba(0, 0, 0, 0.12) 0px,
                rgba(0, 0, 0, 0.12) 1px,
                transparent 1px,
                transparent 2px
            ),
            repeating-linear-gradient(
                45deg,
                rgba(255, 255, 255, 0.08) 0px,
                rgba(255, 255, 255, 0.08) 2px,
                transparent 2px,
                transparent 4px
            ),
            repeating-linear-gradient(
                -45deg,
                rgba(0, 0, 0, 0.1) 0px,
                rgba(0, 0, 0, 0.1) 2px,
                transparent 2px,
                transparent 4px
            ),
            repeating-linear-gradient(
                0deg,
                rgba(255, 255, 255, 0.05) 0px,
                rgba(255, 255, 255, 0.05) 3px,
                transparent 3px,
                transparent 6px
            ),
            repeating-linear-gradient(
                90deg,
                rgba(0, 0, 0, 0.08) 0px,
                rgba(0, 0, 0, 0.08) 3px,
                transparent 3px,
                transparent 6px
            ),
            linear-gradient(
                135deg,
                #0d2a0d 0%,
                #1a3a1a 25%,
                #0f3a0f 50%,
                #1a3a1a 75%,
                #0d2a0d 100%
            );
        background-size: 
            100% 100%,
            100% 100%,
            100% 100%,
            100% 100%,
            100% 100%,
            100% 100%,
            400% 400%;
        background-attachment: fixed;
    }

    .search-results-empty {
        color: #00aa00;
        font-size: 14px;
        text-align: center;
        padding: 20px;
        font-family: 'MS Sans Serif', Arial, sans-serif;
    }

    .search-results-error {
        color: #ff6666;
        font-size: 14px;
        text-align: center;
        padding: 20px;
        font-family: 'MS Sans Serif', Arial, sans-serif;
    }

    /* User result item */
    .user-result {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px;
        margin-bottom: 8px;
        background: #c0c0c0;
        border: 2px solid;
        border-color: #dfdfdf #0a0a0a #0a0a0a #dfdfdf;
        box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #ffffff;
        cursor: pointer;
        transition: background-color 0.2s;
    }

    .user-result:hover {
        background: #000080;
    }

    .user-result:hover .user-info-name,
    .user-result:hover .user-info-username,
    .user-result:hover .user-info-about {
        color: #ffffff;
    }

    .user-avatar {
        width: 50px;
        height: 50px;
        border: 2px solid;
        border-color: #dfdfdf #0a0a0a #0a0a0a #dfdfdf;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        flex-shrink: 0;
    }

    .user-info {
        flex: 1;
        min-width: 0;
    }

    .user-info-name {
        font-weight: bold;
        font-size: 13px;
        color: #000000;
        margin-bottom: 2px;
    }

    .user-info-username {
        font-size: 12px;
        color: #0000aa;
        margin-bottom: 2px;
    }

    .user-info-about {
        font-size: 11px;
        color: #000000;
        opacity: 0.8;
        word-break: break-word;
    }

    .user-action {
        display: flex;
        gap: 8px;
        flex-shrink: 0;
    }

    .user-action-btn {
        min-width: 70px;
        padding: 4px 12px;
        font-size: 12px;
    }

    .window {
        display: flex;
        flex-direction: column;
        height: auto;
    }
</style>

<div class="search-container">
    <div class="search-main">
        <div class="window">
            <div class="title-bar">
                <div class="title-bar-text">🔍 Поиск пользователей</div>
                <div class="title-bar-controls">
                    <button aria-label="Close"></button>
                </div>
            </div>
            <div class="window-body" style="padding: 0; display: flex; flex-direction: column; max-height: calc(100vh - 180px);">
                <div class="search-input-area">
                    <div class="search-input-wrapper">
                        <input type="text" id="searchInput" class="search-input" placeholder="Введите username или имя..." autofocus>
                        <button id="searchBtn" class="btn search-btn">Найти</button>
                    </div>
                </div>

                <div class="sunken-panel search-results" id="searchResults">
                    <div class="search-results-empty">Введите поисковый запрос...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const resultsDiv = document.getElementById('searchResults');

    async function performSearch() {
        const query = searchInput.value.trim();
        if (!query) {
            resultsDiv.innerHTML = '<div class="search-results-empty">Введите поисковый запрос...</div>';
            return;
        }

        try {
            const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
            const users = await response.json();

            if (users.length === 0) {
                resultsDiv.innerHTML = '<div class="search-results-empty">Никого не найдено</div>';
                return;
            }

            let html = '';
            users.forEach(user => {
                html += `
                    <div class="user-result" onclick="window.location.href='/chat/${user.username}'">
                        <div class="user-avatar">👤</div>
                        <div class="user-info">
                            <div class="user-info-name">${user.name}</div>
                            <div class="user-info-username">@${user.username}</div>
                            ${user.about ? `<div class="user-info-about">${user.about}</div>` : ''}
                        </div>
                        <div class="user-action">
                            <button class="btn user-action-btn" onclick="event.stopPropagation(); window.location.href='/chat/${user.username}'">Чат</button>
                        </div>
                    </div>
                `;
            });
            resultsDiv.innerHTML = html;
        } catch (err) {
            console.error('Search error:', err);
            resultsDiv.innerHTML = '<div class="search-results-error">Ошибка при поиске</div>';
        }
    }

    searchBtn.addEventListener('click', performSearch);
    searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            performSearch();
        }
    });
</script>

{% endblock %}
