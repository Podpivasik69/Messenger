{% extends "old/base.html" %}
{% block content %}

<style>
    .auth-wrapper {
        max-width: 320px;
        margin: 40px auto;
    }

    .auth-card {
        background: silver;
        padding: 12px;
        box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #dfdfdf, inset -2px -2px grey, inset 2px 2px #fff;
    }

    .auth-title {
        font-weight: bold;
        font-size: 14px;
        text-align: center;
        margin-bottom: 16px;
    }

    .form-group {
        margin-bottom: 12px;
    }

    .form-label {
        display: block;
        font-weight: bold;
        font-size: 11px;
        margin-bottom: 4px;
    }

    .form-input {
        width: 100%;
        padding: 4px 6px;
        border: none;
        background-color: #fff;
        box-shadow: inset -1px -1px #fff, inset 1px 1px grey, inset -2px -2px #dfdfdf, inset 2px 2px #0a0a0a;
        box-sizing: border-box;
        font-size: 11px;
        color: #000;
        font-family: Arial;
    }

    .form-input:focus {
        outline: 1px dotted #000;
        outline-offset: -2px;
    }

    .error-message {
        color: #c00;
        font-size: 11px;
        margin-bottom: 12px;
        padding: 6px;
        background: #fff;
        box-shadow: inset -1px -1px #fff, inset 1px 1px grey, inset -2px -2px #dfdfdf, inset 2px 2px #0a0a0a;
    }

    .auth-buttons {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
    }

    .auth-buttons button {
        flex: 1;
        background: silver;
        border: none;
        box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff, inset -2px -2px grey, inset 2px 2px #dfdfdf;
        color: #000;
        padding: 6px 12px;
        font-size: 11px;
        cursor: pointer;
        font-family: Arial;
    }

    .auth-buttons button:hover {
        box-shadow: inset -1px -1px #fff, inset 1px 1px #0a0a0a, inset -2px -2px #dfdfdf, inset 2px 2px grey;
    }

    .auth-link {
        text-align: center;
        font-size: 11px;
    }

    .auth-link a {
        color: #00f;
        text-decoration: none;
    }

    .auth-link a:hover {
        text-decoration: underline;
    }
</style>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-title">Вход в Senger</div>

        {% if message %}
        <div class="error-message">{{ message }}</div>
        {% endif %}

        <form method="POST">
            {{ form.hidden_tag() }}

            <div class="form-group">
                <label class="form-label">{{ form.username.label }}</label>
                {{ form.username(class="form-input", size=30) }}
            </div>

            <div class="form-group">
                <label class="form-label">{{ form.password.label }}</label>
                {{ form.password(class="form-input", size=30) }}
            </div>

            <div class="auth-buttons">
                <button type="submit">Войти</button>
            </div>
        </form>

        <div class="auth-link">
            Нет аккаунта? <a href="/register">Зарегистрироваться</a>
        </div>
    </div>
</div>

{% endblock %}
